<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca do Curso</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header>
<h1>Biblioteca do Curso</h1>
<p>Cada semana do roadmap é um livro. Abra, leia os capítulos e marque como lidos para acompanhar seu avanço.</p>
<div class="bar" aria-hidden="true"><i id="pb"></i></div>
<p id="pt" style="margin-top:8px;font-size:14px"></p>
</header>
<main class="shelf" id="shelf"></main>
<dialog id="dlg" aria-label="Livro"><button class="x" id="cl">Fechar</button><div class="rd"><aside class="side" id="side"></aside><section class="page" id="pg"></section></div></dialog>
<dialog id="cod" aria-label="Código ampliado"><button class="x" id="cc">Fechar</button><pre id="cp"></pre></dialog>
<script src="app.js" defer></script>
</body>
</html>
